name: AgentShield Security Scan

on:
  push:
    paths:
      - '.github/**'
  pull_request:
    paths:
      - '.github/**'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run AgentShield
        # Version pineada (1.6.0) para CI determinista: npx latest cambia reglas sin aviso.
        # Gate contra baseline: solo fallan hallazgos criticos/altos NUEVOS o caida de score.
        # Riesgo aceptado por el dueno (2026-10-16, bitacora): `permission.bash: allow`
        # en opencode.json es decision deliberada del flujo sin-preguntas; consta en baseline.
        run: |
          # GitHub ejecuta con bash -e: sin set +e, un exit!=0 de npx mata el step
          # antes de evaluar el gate (fue la causa del rojo anterior).
          set +e
          npx ecc-agentshield@1.6.0 scan --path . --baseline .agentshield-baseline.json --gate
          code=$?
          if [ "$code" -eq 0 ] || [ "$code" -eq 2 ]; then echo "AgentShield gate OK (exit $code: 0=limpio, 2=sin regresiones vs baseline)"; exit 0; fi
          echo "AgentShield gate FAILED (exit $code)"; exit "$code"
