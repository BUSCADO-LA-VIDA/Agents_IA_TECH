name: Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  gitleaks:
    name: Detect secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks (open-source CLI)
        run: |
          # Official install script resolves the latest open-source release (no license required)
          curl -sSfL https://raw.githubusercontent.com/gitleaks/gitleaks/master/install.sh | sh
          ./bin/gitleaks version

      - name: Run gitleaks
        run: ./bin/gitleaks detect --source . --redact --verbose
