name: Spellcheck

on:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/**.yml'
      - '.opencode/**.json'
      - 'opencode.json'
  pull_request:
    paths:
      - '.github/workflows/**.yml'
      - '.opencode/**.json'
      - 'opencode.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codespell:
    name: Check spelling (config, EN)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run codespell
        uses: codespell-project/actions-codespell@v2
        with:
          check_filenames: true
          check_hidden: true
          # This repo's docs are intentionally in Spanish (see Documentacion/idioma.md),
          # so this check covers only English-config files (.github/workflows, .opencode, opencode.json).
          skip: |
            .git,*.lock,
            Documentacion,README.md,openwiki,AGENTS.md,CLAUDE.md,
            .github/agents,.github/prompts,.github/skills,.github/copilot-instructions.md,
            .opencode/agents,.opencode/commands,sync-agents.ps1
