name: ECC Dry‑run

on:
  push:
    branches: [ main ]

jobs:
  dry-run:
    runs-on: windows-latest
    steps:
      - name: Run orchestrator dry‑run
        run: .\\scripts\\ecc-orchestrator.ps1 --dry-run
      - name: Report result
        run: |
          if %errorlevel% equ 0 (
            echo 
Dry‑run
succeeded > reports\ecc-test-dryrun.md
          ) else (
            echo Dry‑run
failed > reports\ecc-test-dryrun.md
          )
