name: ECC Dry-run

on:
  push:
    branches: [ master ]

jobs:
  dry-run:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run orchestrator dry-run
        shell: pwsh
        run: .\scripts\ecc-orchestrator.ps1 -action status -dryrun
      - name: Report result
        shell: pwsh
        run: |
          if ($LASTEXITCODE -eq 0) { "Dry-run succeeded" | Out-File reports\ecc-test-dryrun.md -Encoding utf8 }
          else { "Dry-run failed" | Out-File reports\ecc-test-dryrun.md -Encoding utf8 }
