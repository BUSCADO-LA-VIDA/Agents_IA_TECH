# Manifest de Dependencias Externas
# Este archivo lista todos los proyectos externos que el agente upgrade_framework gestiona
# Al clonar el repositorio principal, este manifest indica qué proyectos externos descargar
# y qué versiones se deben usar

dependencias_externas:
  - nombre: spec-kit
    url: https://github.com/github/spec-kit
    rama: main
    version_actual: v0.0.0  # Se actualizará en la primera ejecución
    ultimo_check: 2026-09-05
    componentes_a_copiar:
      - src/speckit-specify/ → .github/skills/speckit-specify/
      - src/speckit-plan/ → .github/skills/speckit-plan/
      - src/speckit-tasks/ → .github/skills/speckit-tasks/
      - src/speckit-converge/ → .github/skills/speckit-converge/
      - src/speckit-implement/ → .github/skills/speckit-implement/
      - src/speckit-analyze/ → .github/skills/speckit-analyze/
      - src/speckit-checklist/ → .github/skills/speckit-checklist/

  - nombre: graphify
    url: https://github.com/tomasgraph/graphify
    rama: main
    version_actual: v0.0.0
    ultimo_check: 2026-09-05
    licencia: MIT  # ✅ Verificada (2026-09-18, fuente https://graphify.net/es/ sección "Security, Licensing & Trust"). Dependencias: NetworkX (BSD), Tree-sitter (MIT) — sin conflictos. Sin telemetría. Guardrail 8 del ADR-0001 satisfecho.
    componentes_a_copiar:
      - bin/graphify → .opencode/bin/
      - lib/ → .opencode/lib/graphify/

  - nombre: markitdown
    url: https://github.com/microsoft/markitdown
    rama: main
    version_actual: 0.1.7
    ultimo_check: 2026-09-12
    licencia: MIT  # ✅ Verificada (2026-09-12)
    tipo: Python + CLI
    rol_pipeline: Paso 1 — convierte cualquier formato (PDF, DOCX, PPTX, XLSX, HTML, etc.) a Markdown. 100% offline, sin IA.
    instalacion: pip install 'markitdown[all]'
    componentes_a_copiar:
      - (herramienta Python instalada vía pip — no se copia código al kit; se usa como CLI/MCP)

  - nombre: markitdown-mcp
    url: https://github.com/microsoft/markitdown
    rama: main
    version_actual: 0.0.1a3  # Versión funcional (requiere mcp<2). PyPI 0.0.1a1 es un stub sin servidor.
    ultimo_check: 2026-09-12
    licencia: MIT  # ✅ Verificada (2026-09-12)
    tipo: MCP server (oficial de Microsoft)
    rol_pipeline: Paso 1 — expone la herramienta convert_to_markdown(uri) para convertir documentos a MD desde el contexto.
    instalacion: pip install markitdown-mcp==0.0.1a3 + pip install "mcp<2"
    componentes_a_copiar:
      - (MCP server instalado vía pip — se registra en .vscode/mcp.json)

  - nombre: codebase-memory-mcp
    url: https://github.com/DeusData/codebase-memory-mcp
    rama: main
    version_actual: 0.9.0
    ultimo_check: 2026-09-12
    licencia: MIT  # ✅ Verificada por security-auditor (2026-09-12)
    tipo: MCP server
    rol_pipeline: Paso 2 — grafo de conocimiento del código (index_repository, query, semantic_search). Bisturí quirúrgico para código.
    instalacion: npm install -g codebase-memory-mcp
    componentes_a_copiar:
      - (MCP server instalado vía npm — se registra en .vscode/mcp.json)

  - nombre: context-mode
    url: https://github.com/mksglu/context-mode
    rama: main
    version_actual: v1.0.169
    ultimo_check: 2026-09-12
    licencia: ELv2  # ⚠️ Elastic License 2.0 — source-available, NO MIT. No ofrecer como SaaS ni quitar avisos de licencia.
    tipo: MCP server
    rol_pipeline: Optimiza la ventana de contexto de los agentes — indexación FTS5+BM25 (ctx_index, ctx_search, ctx_fetch_and_index), ejecución sandbox (ctx_execute), agrupación (ctx_batch_execute), mantenimiento (ctx_purge, ctx_stats, ctx_upgrade, ctx_doctor).
    instalacion: npm install -g context-mode
    requisitos: Node.js >= 22.5
    componentes_a_copiar:
      - (MCP server instalado vía npm — se registra en .vscode/mcp.json + hooks .github/hooks/context-mode.json)

  - nombre: tokenslayer-mcp-server
    url: https://github.com/ajvikram/TokenSlayer
    rama: main
    version_actual: v1.5.0 (tag repo, commit 9a380c04) / server interno 1.3.0 (package.json + handshake MCP) — skew upstream documentado, no afecta funcionamiento (instalado 2026-09-18, build OK, handshake MCP OK)
    ultimo_check: 2026-09-18
    licencia: MIT  # ✅ Verificada (2026-09-18, fase documental tarea [TOKENSLAYER]). Guardrail 8 del ADR-0001 satisfecho.
    tipo: MCP server standalone (carpeta mcp-server/ — NO viene en el .vsix; clonar + compilar)
    rol_pipeline: Compactación de contexto — esqueletos AST + call graphs + patch estructural (analyze_files, analyze_workspace, analyze_dependency_chain, expand_node, apply_patch, get_stats, clear_stats). Complementa a context-mode (docs) y codebase-memory-mcp (grafo), no los reemplaza.
    instalacion: git clone https://github.com/ajvikram/TokenSlayer.git + (cd mcp-server && npm install && npm run build)
    requisitos: Node.js v24.14.0 + extensión VS Code ajvikram.tokenslayer v1.5.0 (opcional, ya instalada)
    componentes_a_copiar:
      - (MCP server compilado desde clon local — se registra en opencode.json + .vscode/mcp.json con "type": "stdio")

