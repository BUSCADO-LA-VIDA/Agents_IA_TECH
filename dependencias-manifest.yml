# Manifest de Dependencias Externas
# Este archivo lista todos los proyectos externos que el agente upgrade_framework gestiona
# Al clonar el repositorio principal, este manifest indica qué proyectos externos descargar
# y qué versiones se deben usar

# -----------------------------------------------------------------------------
# Herramientas del entorno (no se clonan: son prerequisitos del runtime)
# -----------------------------------------------------------------------------
# Regla de gobernanza: SIEMPRE la ultima version disponible de cada herramienta.
# Ninguna herramienta del entorno se usa con una version anterior a la ultima
# publicada, salvo razon documentada y aprobada por el usuario.
# Antes de usar una herramienta, se verifica su version contra la ultima disponible.
# Referencia: skill `dependency-hygiene` y ADR-0013.
entorno_herramientas:
  - nombre: powershell
    version_minima: "7.0"
    version_recomendada: ultima
    verificacion: "$PSVersionTable.PSVersion"
    rol: Runtime de todos los scripts del kit (`.ps1`). `#requires -Version 7.0` en cada script.

  - nombre: pester
    version_minima: "6.0"
    version_recomendada: ultima
    version_verificada: "6.2.0"
    fecha_verificacion: 2026-10-29
    verificacion: "Get-Module -ListAvailable Pester | Select-Object -ExpandProperty Version"
    instalacion: "Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck -AllowClobber"
    rol: "Framework de tests de PowerShell. Requisito 6.x: los tests usan sintaxis de Pester 5+ (Should -Be, aislamiento de scope), incompatible con Pester 3.4.0 preinstalado."
    nota_deuda: DD-08. La suite no ejecutaba por desajuste de version. Resuelto 2026-10-29.

  - nombre: node
    version_minima: "18"
    version_recomendada: ultima
    verificacion: "node --version"
    rol: Runtime de los MCP servers locales (context-mode, playwright, tokenslayer, context7).

  - nombre: python
    version_minima: "3.10"
    version_recomendada: ultima
    verificacion: "python --version"
    rol: Runtime de markitdown y graphify (MCP servers locales).

dependencias_externas:
  - nombre: spec-kit
    url: https://github.com/github/spec-kit
    rama: main
    version_actual: v1.4.0  # release 2026-11-10; verificado 2026-11-12
    ultimo_check: 2026-11-12
    licencia: MIT  # Verificada 2026-11-12 via API de GitHub (SPDX: MIT)
    mecanismo: >
      CLI `specify` (specify-cli instalado con `uv tool`) + `specify integration upgrade --script ps`.
      NO se copian carpetas a mano: el manifest de la integracion trackea hashes por archivo.
    instalacion: uv tool install specify-cli --force --from git+https://github.com/github/spec-kit.git@v1.4.0
    componentes_gestionados:
      - .specify/scripts/powershell/{check-prerequisites,common,create-new-feature,resolve-template,setup-plan,setup-tasks}.ps1
      - .specify/templates/{spec,plan,tasks,checklist,constitution}-template.md
      - .specify/.gitignore
      - .github/skills/speckit-{analyze,checklist,clarify,constitution,converge,implement,plan,specify,tasks}/SKILL.md (9, dentro del manifest)
      - .github/skills/speckit-taskstoissues/SKILL.md (retirado por 1.4.0; el kit lo conserva fuera del manifest)
      - .opencode/skills/speckit-*/SKILL.md (mismo prompt 1.4.0 + bloque Documentation First del kit)
    parches_del_kit:
      - .specify/scripts/powershell/check-prerequisites.ps1 -> gate Documentation First (rechaza FEATURE_DIR fuera de Documentacion/<AppName>/specs/, sin allowlist)
      - .specify/.gitignore -> bloque graphify-out/* (1.4.0 lo reemplazo por integrations/packages/)
    nota_actualizacion: >
      Los dos parches no sobreviven a `specify integration upgrade --force`: hay que re-aplicarlos
      (deuda DD-10 en Documentacion/Agents_IA_TECH/pendientes-implementacion.md).
      `specify integration status` queda en WARNING con 2 archivos modificados, a proposito:
      los hashes del manifest son los de 1.4.0 y el contraste frena un upgrade silencioso.

  - nombre: graphify
    url: https://github.com/Graphify-Labs/graphify
    rama: main
    version_actual: 0.9.48 (PyPI graphifyy — pin exacto; instalado 2026-09-18 vía `uv tool install "graphifyy[mcp]"` + `pip install "graphifyy[mcp]==0.9.48"`, ambos alineados)
    ultimo_check: 2026-09-18
    licencia: Apache-2.0/MIT dual  # ✅ Aceptada por el usuario (2026-09-19). PyPI License-Expression: Apache-2.0; README upstream dual Apache-2.0/MIT + LICENSE-MIT. Guardrail 8 del ADR-0001 satisfecho con nota.
    tipo: Paquete Python (PyPI `graphifyy` — doble-y, oficialidad repo↔PyPI verificada 2026-09-18) + MCP server embebido (`python -m graphify.serve`, stdio; 10 herramientas incl. `triage_prs` verificado solo-lectura)
    rol_pipeline: Grafo de conocimiento del código consultable (query_graph, get_node, get_neighbors, shortest_path, PRs) — Rama A MCP stdio preferida (RF-19); fallback Rama B CLI (`graphify --version`).
    instalacion: uv tool install "graphifyy[mcp]==0.9.48" (aislado, preferido — por qué: evita contaminar el Python global y `pip install` ejecuta build hooks; ver seguridad/graphify.md R-1) o pip install "graphifyy[mcp]==0.9.48" (Python 3.10+). JAMÁS `pip install graphify` (una-y: typosquatting) ni `--transport http` en red (R-2).
    nota_url_anterior: La URL anterior https://github.com/tomasgraph/graphify devuelve 404 (muerta/no pública, verificado 2026-09-19 fase documental `documentador`). Upstream real: Graphify-Labs/graphify (decisión del usuario 2026-09-19).
    componentes_a_copiar:
      - (herramienta Python instalada vía uv/pip — no se copia código al kit; se registra en opencode.json + .vscode/mcp.json vía Configure-Graphify; sin git clone, no aplica la allowlist del bootstrap)

  - nombre: markitdown
    url: https://github.com/microsoft/markitdown
    rama: main
    version_actual: 0.1.7
    ultimo_check: 2026-09-12
    licencia: MIT  # ✅ Verificada (2026-09-12)
    tipo: Python + CLI
    rol_pipeline: Paso 1 — convierte cualquier formato (PDF, DOCX, PPTX, XLSX, HTML, etc.) a Markdown. 100% offline, sin IA.
    instalacion: pip install 'markitdown[all]'
    componentes_a_copiar:
      - (herramienta Python instalada vía pip — no se copia código al kit; se usa como CLI/MCP)

  - nombre: markitdown-mcp
    url: https://github.com/microsoft/markitdown
    rama: main
    version_actual: 0.0.1a3  # Versión funcional (requiere mcp<2). PyPI 0.0.1a1 es un stub sin servidor.
    ultimo_check: 2026-09-12
    licencia: MIT  # ✅ Verificada (2026-09-12)
    tipo: MCP server (oficial de Microsoft)
    rol_pipeline: Paso 1 — expone la herramienta convert_to_markdown(uri) para convertir documentos a MD desde el contexto.
    instalacion: pip install markitdown-mcp==0.0.1a3 + pip install "mcp<2"
    componentes_a_copiar:
      - (MCP server instalado vía pip — se registra en .vscode/mcp.json)

  - nombre: codebase-memory-mcp
    url: https://github.com/DeusData/codebase-memory-mcp
    rama: main
    version_actual: 0.9.0
    ultimo_check: 2026-09-12
    licencia: MIT  # ✅ Verificada por security-auditor (2026-09-12)
    tipo: MCP server
    rol_pipeline: Paso 2 — grafo de conocimiento del código (index_repository, query, semantic_search). Bisturí quirúrgico para código.
    instalacion: npm install -g codebase-memory-mcp
    componentes_a_copiar:
      - (MCP server instalado vía npm — se registra en .vscode/mcp.json)

  - nombre: context-mode
    url: https://github.com/mksglu/context-mode
    rama: main
    version_actual: v1.0.169
    ultimo_check: 2026-09-12
    licencia: ELv2  # ⚠️ Elastic License 2.0 — source-available, NO MIT. No ofrecer como SaaS ni quitar avisos de licencia.
    tipo: MCP server
    rol_pipeline: Optimiza la ventana de contexto de los agentes — indexación FTS5+BM25 (ctx_index, ctx_search, ctx_fetch_and_index), ejecución sandbox (ctx_execute), agrupación (ctx_batch_execute), mantenimiento (ctx_purge, ctx_stats, ctx_upgrade, ctx_doctor).
    instalacion: npm install -g context-mode
    requisitos: Node.js >= 22.5
    componentes_a_copiar:
      - (MCP server instalado vía npm — se registra en .vscode/mcp.json + hooks .github/hooks/context-mode.json)

  - nombre: tokenslayer-mcp-server
    url: https://github.com/ajvikram/TokenSlayer
    rama: main
    version_actual: v1.5.0 (tag repo, commit 9a380c04) / server interno 1.3.0 (package.json + handshake MCP) — skew upstream documentado, no afecta funcionamiento (instalado 2026-09-18, build OK, handshake MCP OK)
    ultimo_check: 2026-09-18
    licencia: MIT  # ✅ Verificada (2026-09-18, fase documental tarea [TOKENSLAYER]). Guardrail 8 del ADR-0001 satisfecho.
    tipo: MCP server standalone (carpeta mcp-server/ — NO viene en el .vsix; clonar + compilar)
    rol_pipeline: Compactación de contexto — esqueletos AST + call graphs + patch estructural (analyze_files, analyze_workspace, analyze_dependency_chain, expand_node, apply_patch, get_stats, clear_stats). Complementa a context-mode (docs) y codebase-memory-mcp (grafo), no los reemplaza.
    instalacion: git clone https://github.com/ajvikram/TokenSlayer.git + (cd mcp-server && npm install && npm run build)
    requisitos: Node.js v24.14.0 + extensión VS Code ajvikram.tokenslayer v1.5.0 (opcional, ya instalada)
    componentes_a_copiar:
      - (MCP server compilado desde clon local — se registra en opencode.json + .vscode/mcp.json con "type": "stdio")

# Aplicaciones del proyecto (bootstrap -> Prepare-Apps -> src/<App>/).
# El kit genérico NO declara apps concretas activas (RF-S5): cada proyecto
# define las suyas en SU copia local del manifest, con licencia verificada
# (guardrail 8) y owner en la allowlist del bootstrap.
# Formato por app: nombre, url, rama, licencia, estructura_objetivo, descripcion.
# `proyect_ext/spec-kit` queda en la raíz (NO se mueve a src\).
# EJEMPLO por proyecto — NO activar en el kit:
# aplicaciones:
#   - nombre: MiApp
#     url: https://github.com/<tu-owner>/MiApp
#     rama: main
#     version_actual: (se resuelve en primera descarga)
#     ultimo_check: 2026-09-19
#     licencia: pendiente de verificar  # Guardrail 8 — verificar antes de integrar
#     estructura_objetivo: src/MiApp/
#     descripcion: Ejemplo de app del proyecto (sustituir por las reales).

