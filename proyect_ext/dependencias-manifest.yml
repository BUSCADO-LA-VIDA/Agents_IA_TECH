# derivados sincronizan su manifest local contra esta referencia vía
# Sync-Manifest (scripts/modules/Manifest/). Esquema mapa (spec 014 §38-49).
# `upgrade: false` pinnea la herramienta (nunca se auto-aplica su versión).
# Actualizado 2026-10-10 desde dependencias-manifest.yml raíz.
