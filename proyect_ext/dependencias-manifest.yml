    upgrade: true
  codebase-memory-mcp:
    version_actual: '0.9.0'
    upgrade: true
  context-mode:
    version_actual: 'v1.0.169'
    upgrade: true
  tokenslayer-mcp-server:
    version_actual: 'v1.5.0'
    upgrade: true
aplicaciones:
